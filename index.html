<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1976D2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Доза">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Калькулятор эффективной дозы</title>

  <style>
    :root {
      --blue: #1976D2;
      --bg: #F4F6F8;
      --gray: #999999;
      --danger: #B00020;
      --text: #111111;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(25, 118, 210, 0.18);
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
    }

    .topbar {
      background: var(--blue);
      color: var(--white);
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    }

    .content {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 18px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .field-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    select,
    input {
      display: block;
      width: 100%;
      min-height: 48px;
      background-color: var(--white);
      border: 1.5px solid var(--gray);
      border-radius: 7px;
      padding: 10px 12px;
      font-size: 18px;
      color: var(--text);
      outline: none;
    }

    input {
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.12);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 19px;
      margin: 12px 0 8px;
    }

    button {
      display: block;
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 999px;
      color: var(--white);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }

    button:active {
      opacity: 0.75;
    }

    .calc-btn {
      background: var(--blue);
    }

    .reset-btn {
      background: var(--gray);
    }

    .warning {
      display: none;
      margin: 10px 0 0;
      text-align: center;
      color: var(--danger);
      font-weight: 700;
      font-style: italic;
      line-height: 1.35;
    }

    .result-block {
      text-align: center;
      padding-top: 10px;
    }

    .result-title {
      font-size: 42px;
      line-height: 1.1;
      font-weight: 800;
      margin: 0 0 6px;
    }

    .result-subtitle {
      font-size: 20px;
      margin: 0 0 8px;
    }

    .result-value {
      font-size: 42px;
      line-height: 1.1;
      font-weight: 800;
      margin: 0;
      word-break: break-word;
    }

    .install-hint {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      color: #666;
      line-height: 1.35;
    }

    @media (max-width: 360px) {
      .content { padding: 14px; }
      .topbar { font-size: 18px; }
      label { font-size: 18px; }
      select, input { font-size: 17px; }
      .buttons { gap: 12px; }
      button { font-size: 16px; }
      .result-title, .result-value { font-size: 36px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">Калькулятор эффективной дозы</div>

    <form id="calcForm" class="content">
      <div class="field-group">
        <label for="study">Область исследования</label>
        <select id="study" name="study">
          <option value="heart">Сосуды сердца</option>
          <option value="brain">Сосуды головного мозга</option>
          <option value="carotid">Сосуды каротидной зоны</option>
          <option value="abdomen">Абдоминальная область и малый таз</option>
          <option value="lower">Сосуды нижних конечностей</option>
          <option value="upper">Сосуды верхних конечностей</option>
        </select>
      </div>

      <div class="field-group">
        <label for="voltage">Напряжение (кВ)</label>
        <select id="voltage" name="voltage">
          <option value="60">60</option>
          <option value="70">70</option>
          <option value="80">80</option>
          <option value="90" selected>90</option>
          <option value="100">100</option>
          <option value="110">110</option>
        </select>
      </div>

      <div class="field-group">
        <label for="dap">Total DAP</label>
        <input id="dap" name="dap" type="text" inputmode="decimal" autocomplete="off">
      </div>

      <div class="field-group">
        <label for="unit">Единица измерения</label>
        <select id="unit" name="unit">
          <option value="1">Gy∙cm²</option>
          <option value="0.01">cGy∙cm²</option>
          <option value="0.001">mGy∙cm²</option>
          <option value="0.000001">μGy∙cm²</option>
          <option value="10000">Gy∙m²</option>
          <option value="100">cGy∙m²</option>
          <option value="10">mGy∙m²</option>
          <option value="0.01">μGy∙m²</option>
        </select>
      </div>

      <div class="buttons">
        <button id="calcBtn" class="calc-btn" type="submit">Рассчитать</button>
        <button id="resetBtn" class="reset-btn" type="button">Сбросить</button>
      </div>

      <p id="warning" class="warning"></p>

      <div class="result-block">
        <p class="result-title">Результат</p>
        <p class="result-subtitle">Эффективная доза</p>
        <p id="result" class="result-value">— мЗв</p>
      </div>

      <div class="install-hint">
        На iPhone: откройте страницу в Safari → Поделиться → На экран «Домой».
      </div>
    </form>
  </div>

  <script>
    function el(id) {
      return document.getElementById(id);
    }

    function parseDap(value) {
      var text = String(value).replace(/,/g, ".").replace(/[^0-9.]/g, "");
      if (text === "") return NaN;
      return parseFloat(text);
    }

    function getKd(study, voltageText) {
      var voltage = parseInt(voltageText, 10);

      if (study === "heart") {
        if (voltage === 70) return 0.19;
        if (voltage === 80) return 0.22;
        if (voltage === 90) return 0.24;
        if (voltage === 100) return 0.27;
        if (voltage === 110) return 0.29;
        return 0;
      }

      if (study === "brain") {
        if (voltage >= 60 && voltage <= 80) return 0.03;
        if (voltage >= 81 && voltage <= 90) return 0.04;
        if (voltage >= 91 && voltage <= 100) return 0.05;
        if (voltage >= 101 && voltage <= 110) return 0.06;
        return 0;
      }

      if (study === "carotid") {
        if (voltage === 60) return 0.09;
        if (voltage === 70) return 0.12;
        if (voltage === 80) return 0.14;
        if (voltage === 90) return 0.15;
        if (voltage === 100) return 0.17;
        if (voltage === 110) return 0.18;
        return 0;
      }

      if (study === "abdomen") {
        if (voltage === 60) return 0.12;
        if (voltage === 70) return 0.16;
        if (voltage === 80) return 0.19;
        if (voltage === 90) return 0.21;
        if (voltage === 100) return 0.24;
        if (voltage === 110) return 0.26;
        return 0;
      }

      if (study === "lower") {
        if (voltage === 60) return 0.08;
        if (voltage === 70) return 0.11;
        if (voltage === 80) return 0.13;
        if (voltage === 90) return 0.15;
        if (voltage === 100) return 0.17;
        if (voltage === 110) return 0.19;
        return 0;
      }

      if (study === "upper") {
        if (voltage === 60) return 0.04;
        if (voltage === 70) return 0.05;
        if (voltage === 80) return 0.06;
        if (voltage === 90) return 0.07;
        if (voltage === 100) return 0.08;
        if (voltage === 110) return 0.08;
        return 0;
      }

      return 0;
    }

    function showWarning(text) {
      var warning = el("warning");
      warning.innerHTML = text;
      warning.style.display = text ? "block" : "none";
    }

    function calculateDose() {
      var dapValue = parseDap(el("dap").value);
      var result = el("result");

      if (isNaN(dapValue) || dapValue < 0) {
        result.innerHTML = "ОШИБКА";
        showWarning("Введите корректное значение Total DAP");
        return false;
      }

      var unitRatio = parseFloat(el("unit").value);
      var kd = getKd(el("study").value, el("voltage").value);

      if (kd === 0) {
        result.innerHTML = "Ошибка";
        showWarning("Для выбранных параметров отсутствует коэффициент Kd");
        return false;
      }

      var dose = dapValue * unitRatio * kd;
      result.innerHTML = dose.toFixed(2).replace(".", ",") + " мЗв";
      showWarning("");
      return false;
    }

    function resetForm() {
      el("study").value = "heart";
      el("voltage").value = "90";
      el("dap").value = "";
      el("unit").value = "1";
      el("result").innerHTML = "— мЗв";
      showWarning("");
      return false;
    }

    function init() {
      el("calcForm").onsubmit = function () {
        return calculateDose();
      };

      el("calcBtn").addEventListener("click", function (event) {
        event.preventDefault();
        calculateDose();
      });

      el("resetBtn").addEventListener("click", function (event) {
        event.preventDefault();
        resetForm();
      });

      el("dap").addEventListener("input", function () {
        this.value = this.value.replace(/[^0-9,.]/g, "");
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
